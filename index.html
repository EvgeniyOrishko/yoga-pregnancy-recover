<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />

    <!-- Set the color theme before first paint so switching pages / reloading
         never flashes the light theme first. Mirrors src/js/widgets/theme.js. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("yoga-theme");
          if (theme === "dark" || theme === "blue") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>

    <!-- SEO. This is the whole point of staying on plain HTML: every tag below and
         every section in <main> is in the source that crawlers fetch - nothing is
         rendered client-side. Fill these in for your own site. -->
    <title>Yoga DB</title>
    <meta name="description" content="" />
    <link rel="canonical" href="{{ site.url }}/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yoga DB" />
    <meta property="og:description" content="" />
    <meta property="og:url" content="{{ site.url }}/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yoga DB" />

    <link href="/favicon.jpg" rel="shortcut icon" type="image/x-icon" />
    <link href="/apple-touch-icon.jpg" rel="apple-touch-icon" />

    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>

  <body class="body">
    <!-- prettier-ignore -->
    {{> header }}

    <!-- prettier-ignore -->
    <main data-w-id="26d559eb-5ca9-1f0c-2838-abcee495c949" class="main">
      {{> sections/hero }}
      {{> sections/sessions }}
      {{> sections/experts }}
      {{> sections/instructors }}
      {{> sections/reviews }}
      {{> sections/journey }}
      {{> sections/plans }}
      {{> sections/timetable }}
      {{> sections/contact }}
    </main>

    <!-- prettier-ignore -->
    {{> footer }}
    <!-- prettier-ignore -->
    {{> modal }}

    <!-- WayForPay's own checkout widget (test-mode "Купити підписку" buttons
         in the plans section) - this is the payment provider's required
         client library, not a CDN dependency of ours. See
         src/js/widgets/wayforpay.js for the integration. -->
    <script src="https://secure.wayforpay.com/server/pay-widget.js"></script>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
