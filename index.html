<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />

    <!-- SEO. Every tag below and every section in <main> is in the source that
         crawlers fetch - nothing is rendered client-side. -->
    <title>Olga Orishko - Wellness &amp; Yoga Studio</title>
    <meta
      name="description"
      content="A warm space to breathe deeply, move mindfully, and return to yourself. Class listings, studio, reviews and everything you need to book your first yoga class."
    />
    <link rel="canonical" href="{{ site.url }}/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Olga Orishko - Wellness &amp; Yoga Studio" />
    <meta
      property="og:description"
      content="A warm space to breathe deeply, move mindfully, and return to yourself."
    />
    <meta property="og:url" content="{{ site.url }}/" />
    <meta property="og:image" content="{{ site.url }}/images/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Olga Orishko - Wellness &amp; Yoga Studio" />
    <meta name="twitter:image" content="{{ site.url }}/images/og-image.jpg" />

    <link href="/favicon.png" rel="icon" type="image/png" />
    <link href="/favicon.png" rel="apple-touch-icon" />

    <script>
      document.documentElement.classList.add("js");
    </script>

    <!-- Restore the colour theme picked in the header switcher (saved by
         widgets/theme.js as ready-made CSS variables) before first paint. -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("site-theme"));
        if (saved && saved.vars) {
          for (var k in saved.vars) document.documentElement.style.setProperty(k, saved.vars[k]);
        }
      } catch (e) {}
    </script>

    <link rel="preload" href="/fonts/cormorant-300.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>

  <body>
    <!-- prettier-ignore -->
    {{> emblem-sprite }}

    <!-- prettier-ignore -->
    {{> loader }}

    <!-- prettier-ignore -->
    {{> header }}

    <!-- prettier-ignore -->
    <main>
      {{> sections/hero }}
      {{> sections/philosophy }}
      {{> sections/studio }}
      {{> sections/classes }}
      {{> sections/reviews }}
      {{> sections/journal }}
      {{> sections/faq }}
    </main>

    <!-- prettier-ignore -->
    {{> footer }}

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
