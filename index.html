<!doctype html>
<!--
  data-wf-* attributes are not decoration - webflow.js's IX2 module reads
  data-wf-page off <html> to scope scroll/load animations to this page (their
  target ids are literally "<data-wf-page>|<data-w-id>"). Without it every
  data-w-id="..." element on the page just sits at its pre-animation state
  from ix2-initial-state.html and never animates in. Keep these in sync with
  the Webflow project if you ever re-export.
-->
<html
  data-wf-domain="yoga-db-showcase.webflow.io"
  data-wf-page="65c50e40afae39c0bdf7ae1a"
  data-wf-site="65c50e40afae39c0bdf7ae15"
  data-wf-status="1"
  lang="uk"
>
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />

    <!-- SEO. This is the whole point of staying on plain HTML: every tag below and
         every section in <main> is in the source that crawlers fetch - nothing is
         rendered client-side. Fill these in for your own site. -->
    <title>Шаблон веб-сайту Webflow HTML</title>
    <meta name="description" content="" />
    <link rel="canonical" href="{{ site.url }}/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Webflow HTML website template" />
    <meta property="og:description" content="" />
    <meta property="og:url" content="{{ site.url }}/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Webflow HTML website template" />

    <link href="/favicon.jpg" rel="shortcut icon" type="image/x-icon" />
    <link href="/apple-touch-icon.jpg" rel="apple-touch-icon" />

    <link rel="stylesheet" href="/src/styles/main.css" />

    {{> head/ix2-initial-state }}

    <!-- Must stay inline and render-blocking: Webflow's CSS keys off .w-mod-js -->
    <script>
      !(function (o, c) {
        var n = c.documentElement,
          t = " w-mod-";
        ((n.className += t + "js"),
          ("ontouchstart" in o || (o.DocumentTouch && c instanceof DocumentTouch)) &&
            (n.className += t + "touch"));
      })(window, document);
    </script>
  </head>

  <body class="body">
    <!-- prettier-ignore -->
    {{> header }}

    <!-- prettier-ignore -->
    <main data-w-id="26d559eb-5ca9-1f0c-2838-abcee495c949" class="main">
      {{> sections/hero }}
      {{> sections/sessions }}
      {{> sections/experts }}
      {{> sections/instructors }}
      {{> sections/reviews }}
      {{> sections/journey }}
      {{> sections/plans }}
      {{> sections/timetable }}
      {{> sections/contact }}
    </main>

    <!-- prettier-ignore -->
    {{> footer }}
    <!-- prettier-ignore -->
    {{> modal }}

    <script src="/vendor/jquery-3.5.1.min.js"></script>
    <script src="/vendor/webflow.js"></script>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
