<header class="site-header" id="top">
  <div class="site-header__bar">
    {{> logo }}

    <nav class="site-nav" aria-label="Main">
      <ul class="site-nav__list">
        <li><a href="#about">About</a></li>
        <li><a href="#our-class">Class</a></li>
        <li><a href="#book">Schedule</a></li>
        <li><a href="#journal">Blog</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <div class="site-header__tools">
      <button
        class="theme-btn"
        type="button"
        aria-expanded="false"
        aria-controls="theme-panel"
        aria-label="Кольори сайту"
      >
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <path
            d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-3.9-4-7.2-9-7.2Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
          <circle cx="7.6" cy="11" r="1.2" fill="currentColor" />
          <circle cx="10.4" cy="7.2" r="1.2" fill="currentColor" />
          <circle cx="15" cy="7.4" r="1.2" fill="currentColor" />
        </svg>
      </button>

      <a class="btn btn--pill btn--coral site-header__cta" href="#book">Book a class</a>

      <button
        class="burger"
        type="button"
        aria-expanded="false"
        aria-controls="mobile-menu"
        aria-label="Open menu"
      >
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <div class="mobile-menu" id="mobile-menu">
    <ul class="mobile-menu__list">
      <li><a href="#top">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#our-class">Class</a></li>
      <li><a href="#book">Schedule</a></li>
      <li><a href="#journal">Blog</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    {{> social }}
  </div>

  <div class="theme-panel" id="theme-panel" role="dialog" aria-label="Кольори сайту" hidden>
    <p class="theme-panel__title">Кольори сайту</p>
    <div class="theme-panel__presets" data-theme-presets></div>

    <p class="theme-panel__label">Змішати своє</p>
    <div class="theme-panel__mix" data-theme-mix></div>

    <button class="theme-panel__reset" type="button" data-theme-reset>Скинути</button>
  </div>
</header>
