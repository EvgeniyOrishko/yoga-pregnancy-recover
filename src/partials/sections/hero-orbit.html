<section class="hero-orbit">
  <div class="hero-orbit__content">
    <h1 class="display">Знову в <em>тілі.</em></h1>
    <p class="lead">Авторський курс з відновлення,<br />після вагітності і пологів з 1-го дня.</p>
    <div class="hero-orbit__actions">
      <a class="btn btn--pill btn--coral" href="#our-class">Починаємо {{> chevron }}</a>
      <a class="btn btn--pill btn--outline" href="#contact">Звʼязатись зі мною</a>
    </div>
  </div>

  <div class="hero-orbit__stage">
    <div class="hero-orbit__orbit">
      <span class="hero-orbit__glow" aria-hidden="true"></span>
      <span class="hero-orbit__ring" aria-hidden="true"></span>

      <figure class="hero-orbit__item hero-orbit__item--1">
        <img
          src="/images/hero-mom.webp"
          alt="A mother holding her newborn baby."
          width="900"
          height="1350"
          fetchpriority="high"
        />
      </figure>
      <figure class="hero-orbit__item hero-orbit__item--2">
        <img
          src="/images/hero-side.webp"
          alt="A mother breastfeeding her baby."
          width="900"
          height="1350"
        />
      </figure>
      <figure class="hero-orbit__item hero-orbit__item--3">
        <img
          src="/images/hero-plank.webp"
          alt="A woman doing a side plank on a yoga mat."
          width="900"
          height="1350"
        />
      </figure>
    </div>
  </div>
</section>
