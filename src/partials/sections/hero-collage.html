<section class="hero-collage">
  <div class="hero-collage__content">
    <h1 class="display">Знову в <em>тілі.</em></h1>
    <p class="lead">Авторський курс з відновлення,<br />після вагітності і пологів з 1-го дня.</p>
    <div class="hero-collage__actions">
      <a class="btn btn--pill btn--coral" href="#our-class">Починаємо {{> chevron }}</a>
      <a class="btn btn--pill btn--outline" href="#contact">Звʼязатись зі мною</a>
    </div>
  </div>

  <div class="hero-collage__stage">
    <span class="hero-collage__disc" aria-hidden="true"></span>
    <img
      class="hero-collage__img hero-collage__img--arch"
      src="/images/hero-mom.webp"
      alt="A mother holding her newborn baby."
      width="900"
      height="1350"
      fetchpriority="high"
    />
    <img
      class="hero-collage__img hero-collage__img--pill"
      src="/images/hero-plank.webp"
      alt="A woman doing a side plank on a yoga mat."
      width="900"
      height="1350"
    />
    <img
      class="hero-collage__img hero-collage__img--orb"
      src="/images/hero-side.webp"
      alt="A mother breastfeeding her baby."
      width="900"
      height="1350"
    />
    <span class="hero-collage__spark" aria-hidden="true">{{> spark }}</span>
  </div>
</section>
